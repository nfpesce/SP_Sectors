name: Update sector weights

on:
  schedule:
    - cron: '0 14 * * 1-5'   # Weekdays at 14:00 UTC (10am ET)
  workflow_dispatch:           # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch sector weights from State Street
        run: node scripts/update-sectors.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet sectors.json || (
            git add sectors.json &&
            git commit -m "chore: update sector weights $(date +%Y-%m-%d)" &&
            git push
          )
